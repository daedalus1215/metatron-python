[project]
name = "metatron-python"
version = "0.1.0"
description = "Compile a Python (FastAPI) backend into a measured architecture model, then check it against its own rules."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
metatron-py = "metatron.main:main"

[dependency-groups]
dev = [
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/metatron"]
exclude = ["**/__specs__"]

[tool.pytest.ini_options]
testpaths = ["src", "tests"]
addopts = "--import-mode=importlib"
python_files = ["*_spec.py"]
python_classes = ["Given*", "When*"]
python_functions = ["then_*"]

[tool.coverage.run]
source = ["metatron"]
omit = ["*/__specs__/*"]

[tool.coverage.report]
fail_under = 80
show_missing = true

[tool.ruff]
line-length = 100
target-version = "py311"
# Fixtures break rules on purpose; they are data, not code.
extend-exclude = ["tests/fixtures"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.metatron]
root = "src/metatron"
add-patterns = [
    # The container and Module/Bind: the DI plumbing every context is wired with.
    { id = "kernel", tier = "Wiring", test = '(^|/)kernel/' },
]
